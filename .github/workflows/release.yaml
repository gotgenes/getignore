name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate release notes
        id: release-notes
        run: |
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<${EOF_MARKER}" >> "${GITHUB_OUTPUT}"
          git-cliff --latest --strip header >> "${GITHUB_OUTPUT}"
          echo "${EOF_MARKER}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.release-notes.outputs.body }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    name: Release Go Binary
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm, linux/arm64, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows, darwin]
        goarch: ["386", amd64, arm, arm64]
        exclude:
          - goarch: "386"
            goos: darwin
          - goarch: "386"
            goos: windows
          - goarch: arm
            goos: darwin
          - goarch: arm
            goos: windows
          - goarch: arm64
            goos: windows
    steps:
      - uses: actions/checkout@v4
      - uses: wangyoucao577/go-release-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          extra_files: LICENSE README.md
          build_command: make
          sha256sum: TRUE

  update-homebrew:
    name: Update Homebrew Formula
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums from release
        run: |
          TAG="${{ github.ref_name }}"
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            gh release download "${TAG}" \
              --repo gotgenes/getignore \
              --pattern "getignore-${TAG}-${platform}.tar.gz.sha256"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read checksums
        id: checksums
        run: |
          TAG="${{ github.ref_name }}"
          echo "darwin_amd64=$(cat "getignore-${TAG}-darwin-amd64.tar.gz.sha256")" >> "${GITHUB_OUTPUT}"
          echo "darwin_arm64=$(cat "getignore-${TAG}-darwin-arm64.tar.gz.sha256")" >> "${GITHUB_OUTPUT}"
          echo "linux_amd64=$(cat "getignore-${TAG}-linux-amd64.tar.gz.sha256")" >> "${GITHUB_OUTPUT}"
          echo "linux_arm64=$(cat "getignore-${TAG}-linux-arm64.tar.gz.sha256")" >> "${GITHUB_OUTPUT}"

      - name: Generate and push formula
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          cat > getignore.rb << 'FORMULA_EOF'
          class Getignore < Formula
            desc "Bootstraps .gitignore files from GitHub gitignore templates"
            homepage "https://github.com/gotgenes/getignore"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/gotgenes/getignore/releases/download/TAG_PLACEHOLDER/getignore-TAG_PLACEHOLDER-darwin-amd64.tar.gz"
                sha256 "DARWIN_AMD64_SHA256"
              end
              on_arm do
                url "https://github.com/gotgenes/getignore/releases/download/TAG_PLACEHOLDER/getignore-TAG_PLACEHOLDER-darwin-arm64.tar.gz"
                sha256 "DARWIN_ARM64_SHA256"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/gotgenes/getignore/releases/download/TAG_PLACEHOLDER/getignore-TAG_PLACEHOLDER-linux-amd64.tar.gz"
                sha256 "LINUX_AMD64_SHA256"
              end
              on_arm do
                url "https://github.com/gotgenes/getignore/releases/download/TAG_PLACEHOLDER/getignore-TAG_PLACEHOLDER-linux-arm64.tar.gz"
                sha256 "LINUX_ARM64_SHA256"
              end
            end

            def install
              bin.install "getignore"
            end

            test do
              system bin/"getignore", "--version"
            end
          end
          FORMULA_EOF

          # Substitute placeholders
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" getignore.rb
          sed -i "s/TAG_PLACEHOLDER/${TAG}/g" getignore.rb
          sed -i "s/DARWIN_AMD64_SHA256/${{ steps.checksums.outputs.darwin_amd64 }}/g" getignore.rb
          sed -i "s/DARWIN_ARM64_SHA256/${{ steps.checksums.outputs.darwin_arm64 }}/g" getignore.rb
          sed -i "s/LINUX_AMD64_SHA256/${{ steps.checksums.outputs.linux_amd64 }}/g" getignore.rb
          sed -i "s/LINUX_ARM64_SHA256/${{ steps.checksums.outputs.linux_arm64 }}/g" getignore.rb

          # Clone the tap, update the formula, commit and push
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/gotgenes/homebrew-gotgenes.git" tap
          cp getignore.rb tap/Formula/getignore.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/getignore.rb
          git commit -m "getignore ${VERSION}"
          git push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
